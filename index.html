<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koopman Contact Forge - Nonlinear Contact Dynamics Linearization Arena</title>
    <meta name="description" content="Interactive arena for linearizing nonlinear contact dynamics using Koopman operator theory with real-time MPC benchmark">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #0a0a0a;
        color: #ffffff;
        overflow-x: hidden;
      }

      code {
        font-family: 'Courier New', monospace;
      }

      #root {
        width: 100%;
        height: 100vh;
      }

      /* Focus-visible styles for keyboard navigation (WCAG) */
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 2px solid #00ff88;
        outline-offset: 2px;
      }

      /* Remove default outline */
      button:focus:not(:focus-visible),
      input:focus:not(:focus-visible),
      select:focus:not(:focus-visible),
      a:focus:not(:focus-visible) {
        outline: none;
      }

      /* Touch target sizes for mobile (iOS/Android 44×44px minimum) */
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        background: #00ff88;
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid #0a0a0a;
        /* Expand hit area without visual bloat */
        box-shadow: 0 0 0 12px transparent;
      }

      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: #00ff88;
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid #0a0a0a;
      }

      /* Increase button padding for better touch targets */
      button {
        min-height: 44px;
      }

      /* Responsive breakpoints for mobile and tablet */
      @media (max-width: 1024px) {
        /* Tablet: stack controls and charts, keep 3D scene prominent */
        #root > div > div {
          grid-template-columns: 1fr 1fr !important;
          grid-template-rows: auto auto auto !important;
        }

        #root > div > div > div:nth-child(1) {
          grid-row: 3 / 4 !important;
          grid-column: 1 / 3 !important;
        }

        #root > div > div > div:nth-child(2) {
          grid-row: 1 / 2 !important;
          grid-column: 1 / 3 !important;
        }

        #root > div > div > div:nth-child(3) {
          grid-row: 2 / 3 !important;
          grid-column: 1 / 3 !important;
        }

        #root > div > div > div:nth-child(4) {
          grid-row: 2 / 3 !important;
          grid-column: 1 / 3 !important;
        }
      }

      @media (max-width: 768px) {
        /* Mobile: single column, scrollable */
        #root > div > div {
          grid-template-columns: 1fr !important;
          grid-template-rows: auto !important;
        }

        #root > div > div > div {
          grid-row: auto !important;
          grid-column: 1 !important;
          min-height: 300px;
        }

        /* Stack header elements */
        header {
          flex-direction: column !important;
          align-items: flex-start !important;
        }

        /* Reduce font sizes for mobile */
        h1 {
          font-size: 18px !important;
        }
      }
    </style>
    <script type="module" crossorigin src="/demo-koopman-contact-forge-interactive-nonlin/assets/index-Bq-wTvLp.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
